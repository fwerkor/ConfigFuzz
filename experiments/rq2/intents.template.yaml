schema_version: 1
name: rq2-mutation-intents-template
metadata:
  status: template
  minimum_per_workload: 150
  primary_pool: method_independent
  generation_policy:
    - scalar parameters exposed by a qualified baseline
    - generic numeric and Boolean boundary mutations
    - generic TP, PP, EP, and CP topology values
    - constraint-derived cases kept in a separate constraint_challenge pool
  freeze_before_campaign: true
intents:
  - intent_id: example-hidden-size-generic-boundary
    workload_id: qwen2-train
    baseline_id: qwen2-train-baseline
    target_parameter: model.hidden_size
    target_value: 3073
    intent_class: integer_adjacent_above
    intent_pool: method_independent
    source_constraint_ids: []
    metadata:
      example_only: true
      remove_before_final_freeze: true
