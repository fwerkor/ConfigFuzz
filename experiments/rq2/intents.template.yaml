schema_version: 1
name: rq2-mutation-intents-template
metadata:
  status: template
  minimum_per_workload: 300
  generation_policy:
    - parameter bounds and adjacent values
    - legal divisibility boundaries and neighboring illegal values
    - guard transitions from disabled to enabled
    - alternative TP, PP, EP, and CP topology decompositions
    - feature interactions
    - backend, version, and capability boundaries
  freeze_before_campaign: true
intents:
