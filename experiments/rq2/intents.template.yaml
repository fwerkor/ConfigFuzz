    workload_id: dense-transformer-small
    baseline_id: dense-transformer-small-baseline
    target_parameter: model.hidden_size
    target_value: 3073
    intent_class: divisibility_adjacent_value
    source_constraint_ids:
      - lmsv.task1.hidden-size-tp-divisibility
    metadata:
      example_only: true
      remove_before_final_freeze: true
