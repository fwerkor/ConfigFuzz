      multi_latent_attention_in_command: true
      sequence_length_in_command: 8192
      expert_parallel: true
      virtual_pipeline: true
      recomputation: true
    selection_reason: >-
      Broad fallback for MLA, long-sequence, MoE, VPP, and recomputation boundaries when the smaller
