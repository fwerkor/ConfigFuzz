    feature_evidence:
      grouped_query_attention: true
      flash_attention: true
      sequence_length: 8192
      context_parallel: true
      ulysses_context_parallel: true
    selection_reason: >-
      The model configuration supplies GQA, FlashAttention, and an 8192-token context, while the
      training template exercises a 32768-token Ulysses context-parallel path.
    blockers:
      - reconcile the 8192-token model snapshot with the 32768-token command-template override
      - confirm the runtime command preserves the FlashAttention path
      - bind real dataset and tokenizer paths
      - validate checkpoint save/load under context parallelism
