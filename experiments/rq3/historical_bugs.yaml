schema_version: 2
name: configfuzz-rq3-historical-benchmark
selection_policy:
  source_queues:
    gpu: experiments/rq3/gpu_issue_candidates.yaml
    npu: experiments/rq3/npu_issue_candidates.yaml
  cutoff_date: '2026-08-03'
  admissible_requirements:
    - issue predates cutoff_date
    - a configuration value or combination is required to trigger the failure
    - the blamed framework revision reproduces the attributed failure
    - the fixed revision does not reproduce the attributed failure
    - the trigger can be expressed by the ConfigFuzz configuration schema
  repetitions_per_revision: 3
  note: Historical admission is differential confirmation; six-method comparisons are performed in the current-version campaign.
deduplication_policy:
  rule: one underlying fix/root cause is one bug
