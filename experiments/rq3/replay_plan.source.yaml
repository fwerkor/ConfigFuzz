schema_version: 1
name: rq3-replay-plan-sources
status: plan_only_not_executed
policy:
  same_harness_on_buggy_and_fixed: true
  fixed_only_tests_may_be_backported_as_harness_code_only: true
  implementation_changes_must_not_be_backported: true
  buggy_revision_requires_three_repetitions: true
  fixed_revision_must_pass: true
  expected_rejection_is_not_a_bug: true
plans:
- candidate_id: mindspeed-03bb94e94855
  readiness: needs_minimal_harness
  trigger_evidence_level: explicit_patch_logic
  trigger_assignments:
    recompute_in_bubble: true
    pipeline_model_parallel_size: '>1'
    num_layers_per_virtual_pipeline_stage: set
  trigger_relations:
  - recompute_num_layers must equal num_layers/PP when per-PP-rank mode is enabled, otherwise it must equal num_layers_per_virtual_pipeline_stage
  oracle:
    kind: validation_or_schedule_failure
    patterns:
    - recompute_num_layers must be None or 0 when using recompute_in_bubble
    fixed_expectation: derived recompute settings are idempotent and scheduling proceeds
  unresolved:
  - construct a CPU-level validate_args harness before using accelerator time
