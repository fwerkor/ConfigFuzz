schema_version: 1
name: rq1-primary-native-validation-adjudication
reviewer: ChatGPT-assisted primary source audit, 2026-08-06
review_status: primary_reviewed
source_revisions:
  MindSpeed-LLM: 79afbee24168aae3c30dedbec9ca04504a3204e4
  MindSpeed: 8659565fc2dc7de3caba13acd97d4e8814f1df7e
  Megatron-LM-core_v0.12.1: a845aa7e12b3a117e24c2352b9e3e60bad2e3a17
policy:
  coverage_labels_are_primary_review_only: true
  second_reviewer_required_for_final_dataset: true
  framework_legality_denominator: Task1 framework requirements and implementation workarounds, excluding ConfigFuzz pool/search
    policies
  policy_only_rows_are_reported_separately: true
  implicit_delayed: No equivalent centralized validator; invariant is enforced by later construction or execution logic.
records:
- constraint_id: lmsv.task1.alibi-context-parallel
  native_validation: partial
  first_affected_milestone: config_validation
  coverage_evidence:
  - file: MindSpeed/mindspeed/arguments.py
    lines:
    - 644
    - 647
    detail: ALiBi with context parallelism is accepted when the CP algorithm is megatron_cp_algo; other CP algorithms are
      rejected.
  coverage_denominator: framework_legality
  notes: The native check covers only the CP-algorithm compatibility condition. It does not enforce the stricter predicate
    ALiBi => CP=1.
- constraint_id: lmsv.task1.alibi-flash-attention
  native_validation: uncovered
  first_affected_milestone: unknown
  coverage_evidence:
  - file: MindSpeed-LLM/mindspeed_llm/features_manager/transformer/flash_attention/alibi_feature.py
    lines:
    - 31
    - 38
    detail: The framework registers an explicit non-FlashAttention ALiBi path, while other code paths also support FlashAttention;
      no rejection equivalent to the predicate was found.
  coverage_denominator: framework_legality
  notes: The normalized predicate is a ConfigFuzz workaround, not a native legality rule in the pinned revision.
- constraint_id: lmsv.task1.attention-heads-tp-cp-divisibility
