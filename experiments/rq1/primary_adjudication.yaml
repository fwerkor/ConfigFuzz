    lines:
    - 499
    - 510
    detail: CP participates in model-parallel-size arithmetic and world-size divisibility; zero fails through arithmetic,
      but there is no direct CP>=1 assertion.
  coverage_denominator: framework_legality
  notes: Some invalid values are rejected indirectly, without a complete or explanatory positivity check.
- constraint_id: lmsv.task1.cosine-decay-iters
