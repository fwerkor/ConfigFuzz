    lines:
    - 559
    - 563
    detail: Megatron explicitly checks divisibility by TP.
  - file: MindSpeed/mindspeed/arguments.py
    lines:
    - 650
    - 653
    detail: MindSpeed checks divisibility by CP*TP for the Ulysses CP algorithm.
  coverage_denominator: framework_legality
  notes: TP divisibility is always checked, while the CP factor is algorithm-dependent. The unconditional TP*CP predicate
    is therefore only partially covered.
- constraint_id: lmsv.task1.context-parallel-size-positive
