    - '1'
    backends:
    - PTA
    frameworks:
    - MindSpeed-LLM
    - Megatron-LM
    stage: configuration-validation
    condition: parallel.context_parallel_size > 1
  sources:
  - file: lmsv_rec/utils/runtime/mutate_and_forward/parallel_mutate/config_validator_moe.py
    source_type: manual_validator
    lines:
    - 374
    - 423
    symbol: EnhancedMegatronConfigValidator._check_parallel_constraints
  rationale: The current lm-sv Ulysses configuration disables CP when TP is one.
  repair:
    target: parallel.context_parallel_size
    strategy: set
    value: 1
- id: lmsv.task1.expert-model-parallel-size-positive
  expression: parallel.expert_model_parallel_size >= 1
