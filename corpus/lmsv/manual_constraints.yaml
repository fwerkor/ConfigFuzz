schema_version: 1
name: lmsv-manual-constraints
baseline:
  repository: fwerkor/lm-sv
  commit: e73ba3d35
  role: manual-rule corpus and evaluation reference; not framework source input
  coverage:
    included:
    - Task1 EnhancedMegatronConfigValidator repair rules
    - Task6 primary mutable_params_pool.yaml sampling rules
    pending:
    - Task1 ParallelParameterMutator sampling and repair rules
    - Task2-Task5 task-specific validators and mutators
    - Task6 inline fallback parameter pool
    - shell-script and framework-template constraints
rules:
- id: lmsv.task1.alibi-context-parallel
  expression: model.position_embedding_type == "alibi" => parallel.context_parallel_size == 1
  kind: conditional
  parameters:
  - model.position_embedding_type
  - parallel.context_parallel_size
  enforcement: repair
  strength: workaround
  status: reviewed
  scope:
    tasks:
    - '1'
    backends:
    - PTA
    frameworks:
    - MindSpeed-LLM
    - Megatron-LM
    stage: configuration-validation
    condition: model.position_embedding_type == "alibi"
  sources:
  - file: lmsv_rec/utils/runtime/mutate_and_forward/parallel_mutate/config_validator_moe.py
    source_type: manual_validator
    lines:
    - 143
    - 174
    symbol: EnhancedMegatronConfigValidator._check_alibi_constraints
  rationale: lm-sv disables context parallel for ALiBi because the current PTA/MindSpeed path does not support that combination
    reliably.
  repair:
    target: parallel.context_parallel_size
    strategy: set
    value: 1
- id: lmsv.task1.alibi-flash-attention
  expression: model.position_embedding_type == "alibi" => model.use_flash_attention == false
  kind: conditional
  parameters:
  - model.position_embedding_type
  - model.use_flash_attention
  enforcement: repair
  strength: workaround
  status: reviewed
  scope:
    tasks:
    - '1'
    backends:
    - PTA
    frameworks:
    - MindSpeed-LLM
    - Megatron-LM
    stage: configuration-validation
    condition: model.position_embedding_type == "alibi"
  sources:
  - file: lmsv_rec/utils/runtime/mutate_and_forward/parallel_mutate/config_validator_moe.py
    source_type: manual_validator
    lines:
    - 143
    - 185
    symbol: EnhancedMegatronConfigValidator._check_alibi_constraints
  rationale: lm-sv turns off explicit flash attention for ALiBi in the current implementation stack.
  repair:
    target: model.use_flash_attention
    strategy: set
    value: false
- id: lmsv.task1.attention-heads-tp-cp-divisibility
  expression: model.num_attention_heads % (parallel.tensor_model_parallel_size * parallel.context_parallel_size) == 0
  kind: relation
  parameters:
  - model.num_attention_heads
  - parallel.tensor_model_parallel_size
  - parallel.context_parallel_size
  enforcement: repair
  strength: framework_requirement
  status: reviewed
  scope:
    tasks:
    - '1'
    backends:
    - PTA
    frameworks:
    - MindSpeed-LLM
    - Megatron-LM
    stage: configuration-validation
  sources:
  - file: lmsv_rec/utils/runtime/mutate_and_forward/parallel_mutate/config_validator_moe.py
    source_type: manual_validator
    lines:
    - 209
    - 224
    symbol: EnhancedMegatronConfigValidator._check_attention_heads
  rationale: Attention heads must be partitionable across tensor and Ulysses context-parallel groups.
  repair:
    target: model.num_attention_heads
    strategy: nearest_divisible
    divisor: parallel.tensor_model_parallel_size * parallel.context_parallel_size
- id: lmsv.task1.context-parallel-size-positive
  expression: parallel.context_parallel_size >= 1
  kind: range
  parameters:
  - parallel.context_parallel_size
  enforcement: repair
  strength: framework_requirement
  status: reviewed
  scope:
    tasks:
    - '1'
    backends:
    - PTA
    frameworks:
    - MindSpeed-LLM
    - Megatron-LM
    stage: configuration-validation
  sources:
  - file: lmsv_rec/utils/runtime/mutate_and_forward/parallel_mutate/config_validator_moe.py
    source_type: manual_validator
    lines:
    - 374
    - 423
    symbol: EnhancedMegatronConfigValidator._check_parallel_constraints
  rationale: Parallel group sizes must be positive integers.
  repair:
    target: parallel.context_parallel_size
    strategy: set
    value: 1
- id: lmsv.task1.cosine-decay-iters
  expression: training.lr_decay_style == "cosine" => training.lr_decay_iters > 0
  kind: conditional
  parameters:
  - training.lr_decay_style
  - training.lr_decay_iters
  - training.train_iters
  enforcement: repair
  strength: lmsv_policy
  status: reviewed
  scope:
    tasks:
    - '1'
    backends:
    - PTA
    frameworks:
    - MindSpeed-LLM
    - Megatron-LM
    stage: configuration-validation
    condition: training.lr_decay_style == "cosine"
  sources:
  - file: lmsv_rec/utils/runtime/mutate_and_forward/parallel_mutate/config_validator_moe.py
    source_type: manual_validator
    lines:
    - 677
    - 722
    symbol: EnhancedMegatronConfigValidator._check_lr_schedule
  rationale: lm-sv fills a missing cosine decay horizon from train_iters to keep generated schedules runnable.
  repair:
    target: training.lr_decay_iters
    strategy: copy
    source: training.train_iters
- id: lmsv.task1.cp-requires-tp
  expression: parallel.context_parallel_size > 1 => parallel.tensor_model_parallel_size >= 2
  kind: conditional
  parameters:
  - parallel.context_parallel_size
