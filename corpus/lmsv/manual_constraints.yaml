  rationale: Experts must distribute evenly across expert-parallel ranks.
  repair:
    target: moe.num_experts
    strategy: nearest_divisible
    divisor: parallel.expert_model_parallel_size
- id: lmsv.task1.ffn-hidden-size-cap
  expression: model.ffn_hidden_size <= 6 * model.hidden_size
  kind: relation
  parameters:
  - model.ffn_hidden_size
  - model.hidden_size
  enforcement: repair
  strength: lmsv_policy
  status: reviewed
  scope:
    tasks:
    - '1'
    backends:
    - PTA
    frameworks:
    - MindSpeed-LLM
    - Megatron-LM
    stage: configuration-validation
  sources:
  - file: lmsv_rec/utils/runtime/mutate_and_forward/parallel_mutate/config_validator_moe.py
    source_type: manual_validator
    lines:
    - 187
    - 196
    symbol: EnhancedMegatronConfigValidator._check_ffn_hidden_size_limit
  rationale: The validator caps the FFN expansion ratio at six to keep generated configurations within the tested lm-sv space.
  repair:
    target: model.ffn_hidden_size
    strategy: cap
    expression: 6 * model.hidden_size
- id: lmsv.task1.ffn-hidden-size-tp-divisibility
