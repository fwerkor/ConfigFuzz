    strategy: cap
    expression: env.LMSV_FLASH_ATTN_MAX_SEQ_LENGTH
- id: lmsv.task1.flash-sequence-limit
  expression: model.use_flash_attention == true => model.seq_length <= env.LMSV_FLASH_ATTN_MAX_SEQ_LENGTH
  kind: conditional
  parameters:
  - model.use_flash_attention
  - model.seq_length
  - env.LMSV_FLASH_ATTN_MAX_SEQ_LENGTH
