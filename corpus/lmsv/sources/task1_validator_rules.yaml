  sources:
  - file: lmsv_rec/utils/runtime/mutate_and_forward/parallel_mutate/config_validator_moe.py
    source_type: manual_validator
    lines:
    - 723
    - 759
    symbol: EnhancedMegatronConfigValidator._check_flash_attention_constraints
  rationale: The configured Ascend flash-attention path is bounded by an environment-specific tested sequence length.
  repair:
    target: model.seq_length
    strategy: cap
    expression: env.LMSV_FLASH_ATTN_MAX_SEQ_LENGTH
- id: lmsv.task1.global-batch-cap
  expression: training.global_batch_size <= env.LMSV_MAX_GLOBAL_BATCH_SIZE_EXCLUSIVE
  kind: environment
  parameters:
  - training.global_batch_size
  - env.LMSV_MAX_GLOBAL_BATCH_SIZE_EXCLUSIVE
  enforcement: repair
  strength: lmsv_policy
  status: reviewed
  scope:
    tasks:
    - '1'
    backends:
    - PTA
    frameworks:
    - MindSpeed-LLM
    - Megatron-LM
    stage: configuration-validation
  sources:
  - file: lmsv_rec/utils/runtime/mutate_and_forward/parallel_mutate/config_validator_moe.py
    source_type: manual_validator
    lines:
    - 273
    - 373
    symbol: EnhancedMegatronConfigValidator._check_global_batch_size
  rationale: lm-sv caps generated global batches using an environment-configurable testing policy rather than a universal
    framework limit.
  repair:
    target: training.global_batch_size
    strategy: cap
    expression: env.LMSV_MAX_GLOBAL_BATCH_SIZE_EXCLUSIVE
- id: lmsv.task1.global-batch-divisibility
  expression: training.global_batch_size % (parallel.data_parallel_size * training.micro_batch_size) == 0
  kind: relation
  parameters:
  - training.global_batch_size
  - parallel.data_parallel_size
  - training.micro_batch_size
  enforcement: repair
  strength: framework_requirement
  status: reviewed
  scope:
    tasks:
    - '1'
    backends:
    - PTA
    frameworks:
    - MindSpeed-LLM
    - Megatron-LM
    stage: configuration-validation
