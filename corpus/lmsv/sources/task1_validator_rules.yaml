  - file: lmsv_rec/utils/runtime/mutate_and_forward/parallel_mutate/config_validator_moe.py
    source_type: manual_validator
    lines:
    - 273
    - 373
    symbol: EnhancedMegatronConfigValidator._check_global_batch_size
  rationale: The global batch must be decomposable into data-parallel micro batches.
  repair:
    target: training.global_batch_size
    strategy: nearest_lower_divisible
    divisor: parallel.data_parallel_size * training.micro_batch_size
- id: lmsv.task1.group-limited-num-groups
  expression: moe.topk_group >= 1 => moe.moe_router_num_groups >= 1
