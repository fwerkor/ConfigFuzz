name: CI

on:
  push:
  pull_request:

jobs:
  configfuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest tests/configfuzz
      - name: CLI smoke test
        run: |
          python -m configfuzz scan \
            --parameter hidden_size \
            --parameter tensor_model_parallel_size \
            --parameter dtype \
            --parameter sequence_parallel \
            --jobs 2 \
            examples/framework_static \
            --output /tmp/configfuzz-smoke.json
          python scripts/run_framework_static_scan.py . \
            --source-subdir examples/framework_static \
            --name ConfigFuzz-fixture \
            --parameter hidden_size \
            --parameter tensor_model_parallel_size \
            --output /tmp/configfuzz-framework-scan.json
          python -m configfuzz graph /tmp/configfuzz-smoke.json \
            --framework ConfigFuzz-fixture \
            --version ci \
            --output /tmp/configfuzz-graph.json
          python -m configfuzz design-intervention \
            /tmp/configfuzz-graph.json \
            examples/framework_static/baseline.json \
            --edge dep-c47258679d480492 \
            --output /tmp/configfuzz-intervention.json
          python -m configfuzz plan-mutation \
            /tmp/configfuzz-graph.json \
            examples/framework_static/baseline.json \
            --parameter tensor_model_parallel_size \
            --value 6 \
            --output /tmp/configfuzz-mutation-plan.json
          python -m configfuzz solve-mutation \
            /tmp/configfuzz-graph.json \
            examples/framework_static/baseline.json \
            --parameter tensor_model_parallel_size \
            --value 6 \
            --output /tmp/configfuzz-solver-plan.json
          python -m configfuzz apply-feedback \
            /tmp/configfuzz-graph.json \
            examples/framework_static/feedback_samples.json \
            examples/framework_static/feedback_baseline.json \
            --output /tmp/configfuzz-feedback-graph.json
          python -m configfuzz solve-mutation \
            /tmp/configfuzz-feedback-graph.json \
            examples/framework_static/feedback_baseline.json \
            --parameter hidden_size \
            --value 152 \
            --output /tmp/configfuzz-feedback-unsat.json
          python -m configfuzz solve-mutation \
            /tmp/configfuzz-feedback-graph.json \
            examples/framework_static/feedback_baseline.json \
            --parameter hidden_size \
            --value 168 \
            --output /tmp/configfuzz-feedback-sat.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(
              Path("/tmp/configfuzz-mutation-plan.json").read_text()
          )["plan"]
          assert plan["proposed_changes"] == {
              "tensor_model_parallel_size": 6,
              "hidden_size": 4104,
          }
          assert not plan["violated_edges"]
          assert not plan["unresolved_edges"]

          solver = json.loads(
              Path("/tmp/configfuzz-solver-plan.json").read_text()
          )["plan"]
          assert solver["status"] == "sat"
          assert solver["proposed_changes"] == {
              "tensor_model_parallel_size": 6,
              "hidden_size": 4104,
          }
          assert not solver["unsupported_edges"]
          assert not solver["violated_soft_edges"]

          intervention = json.loads(
              Path("/tmp/configfuzz-intervention.json").read_text()
          )["intervention"]
          assert intervention["cases"]["satisfying"]["status"] == "sat"
          assert intervention["cases"]["violating"]["status"] == "sat"
          assert intervention["cases"]["repaired"]["status"] == "sat"
          assert (
              intervention["cases"]["violating"]["probe_sample_template"]
              ["intervention_role"]
              == "violating"
          )

          feedback = json.loads(
              Path("/tmp/configfuzz-feedback-graph.json").read_text()
          )["feedback"]
          assert not feedback["duplicate_batch"]
          assert len(feedback["confirmed_edges"]) == 1

          unsat = json.loads(
              Path("/tmp/configfuzz-feedback-unsat.json").read_text()
          )["plan"]
          sat = json.loads(
              Path("/tmp/configfuzz-feedback-sat.json").read_text()
          )["plan"]
          assert unsat["status"] == "unsat"
          assert sat["status"] == "sat"
          PY
      - name: Runtime inference smoke test
        run: |
          python -m configfuzz infer \
            examples/toy_parallel_size.json \
            --samples-output /tmp/configfuzz-runtime-samples.json \
            --output /tmp/configfuzz-runtime-spec.json
          python -m configfuzz design-intervention \
            artifacts/lmsv_static_inventory.json \
            experiments/lmsv_validator_baseline.json \
            --edge dep-c47258679d480492 \
            --output /tmp/configfuzz-lmsv-intervention.json
          python -m configfuzz run-intervention \
            /tmp/configfuzz-lmsv-intervention.json \
            experiments/manifests/lmsv_hidden_size_intervention.json \
            --output /tmp/configfuzz-lmsv-intervention-samples.json
          python -m configfuzz apply-feedback \
            artifacts/lmsv_static_inventory.json \
            /tmp/configfuzz-lmsv-intervention-samples.json \
            experiments/lmsv_validator_baseline.json \
            --output /tmp/configfuzz-lmsv-intervention-feedback.json
          python -m configfuzz select-interventions \
            artifacts/lmsv_static_inventory.json \
            experiments/lmsv_validator_baseline.json \
            --limit 3 \
            --output /tmp/configfuzz-lmsv-selection.json
          python -m configfuzz run-intervention \
            /tmp/configfuzz-lmsv-selection.json \
            experiments/manifests/lmsv_hidden_size_intervention.json \
            --candidate-index 0 \
            --output /tmp/configfuzz-lmsv-selected-samples.json
          python -m configfuzz apply-feedback \
            artifacts/lmsv_static_inventory.json \
            /tmp/configfuzz-lmsv-selected-samples.json \
            experiments/lmsv_validator_baseline.json \
            --output /tmp/configfuzz-lmsv-selected-feedback.json
          python -m configfuzz active-validate \
            artifacts/lmsv_static_inventory.json \
            experiments/manifests/lmsv_hidden_size_intervention.json \
            --rounds 2 \
            --output /tmp/configfuzz-lmsv-active-validation.json
          python - <<'PY'
          import json
          from pathlib import Path

          samples = json.loads(
              Path("/tmp/configfuzz-lmsv-intervention-samples.json").read_text()
          )["samples"]
          feedback = json.loads(
              Path("/tmp/configfuzz-lmsv-intervention-feedback.json").read_text()
          )["feedback"]
          selection = json.loads(
              Path("/tmp/configfuzz-lmsv-selection.json").read_text()
          )["selection"]
          selected_samples = json.loads(
              Path("/tmp/configfuzz-lmsv-selected-samples.json").read_text()
          )["samples"]
          selected_feedback = json.loads(
              Path("/tmp/configfuzz-lmsv-selected-feedback.json").read_text()
          )["feedback"]
          active = json.loads(
              Path("/tmp/configfuzz-lmsv-active-validation.json").read_text()
          )["active_validation"]
          assert [sample["outcome"]["label"] for sample in samples] == [
              "valid",
              "invalid",
              "valid",
          ]
          assert samples[1]["provenance_matched"] is True
          assert feedback["paired_interventions"] == 1
          assert feedback["confirmed_edges"] == ["dep-c47258679d480492"]
          selected_edge = selection["candidates"][0]["edge_id"]
          assert [sample["outcome"]["label"] for sample in selected_samples] == [
              "valid",
              "invalid",
              "valid",
          ]
          assert selected_samples[1]["provenance_matched"] is True
          assert selected_feedback["paired_interventions"] == 1
          assert selected_feedback["confirmed_edges"] == [selected_edge]
          assert active["summary"]["stop_reason"] == "budget_exhausted"
          assert active["summary"]["rounds_executed"] == 2
          assert len(set(active["summary"]["attempted_edges"])) == 2
          assert all(
              round_["feedback"]["paired_interventions"] == 1
              for round_ in active["rounds"]
          )
          PY
      - name: Manual constraint corpus check
        run: |
          python scripts/build_lmsv_manual_corpus.py --check
          python -m configfuzz validate-corpus corpus/lmsv/manual_constraints.yaml --output /tmp/configfuzz-corpus-summary.json
