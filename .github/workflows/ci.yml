name: CI

on:
  push:
  pull_request:

jobs:
  configfuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest tests/configfuzz
      - name: CLI smoke test
        run: |
          python -m configfuzz scan \
            --parameter hidden_size \
            --parameter tensor_model_parallel_size \
            --parameter dtype \
            --parameter sequence_parallel \
            --jobs 2 \
            examples/framework_static \
            --output /tmp/configfuzz-smoke.json
          python scripts/run_framework_static_scan.py . \
            --source-subdir examples/framework_static \
            --name ConfigFuzz-fixture \
            --parameter hidden_size \
            --parameter tensor_model_parallel_size \
            --output /tmp/configfuzz-framework-scan.json
          python -m configfuzz graph /tmp/configfuzz-smoke.json \
            --framework ConfigFuzz-fixture \
            --version ci \
            --output /tmp/configfuzz-graph.json
          python -m configfuzz plan-mutation \
            /tmp/configfuzz-graph.json \
            examples/framework_static/baseline.json \
            --parameter tensor_model_parallel_size \
            --value 6 \
            --output /tmp/configfuzz-mutation-plan.json
          python -m configfuzz solve-mutation \
            /tmp/configfuzz-graph.json \
            examples/framework_static/baseline.json \
            --parameter tensor_model_parallel_size \
            --value 6 \
            --output /tmp/configfuzz-solver-plan.json
          python -m configfuzz apply-feedback \
            /tmp/configfuzz-graph.json \
            examples/framework_static/feedback_samples.json \
            examples/framework_static/feedback_baseline.json \
            --output /tmp/configfuzz-feedback-graph.json
          python -m configfuzz solve-mutation \
            /tmp/configfuzz-feedback-graph.json \
            examples/framework_static/feedback_baseline.json \
            --parameter hidden_size \
            --value 152 \
            --output /tmp/configfuzz-feedback-unsat.json
          python -m configfuzz solve-mutation \
            /tmp/configfuzz-feedback-graph.json \
            examples/framework_static/feedback_baseline.json \
            --parameter hidden_size \
            --value 168 \
            --output /tmp/configfuzz-feedback-sat.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(
              Path("/tmp/configfuzz-mutation-plan.json").read_text()
          )["plan"]
          assert plan["proposed_changes"] == {
              "tensor_model_parallel_size": 6,
              "hidden_size": 4104,
          }
          assert not plan["violated_edges"]
          assert not plan["unresolved_edges"]

          solver = json.loads(
              Path("/tmp/configfuzz-solver-plan.json").read_text()
          )["plan"]
          assert solver["status"] == "sat"
          assert solver["proposed_changes"] == {
              "tensor_model_parallel_size": 6,
              "hidden_size": 4104,
          }
          assert not solver["unsupported_edges"]
          assert not solver["violated_soft_edges"]

          feedback = json.loads(
              Path("/tmp/configfuzz-feedback-graph.json").read_text()
          )["feedback"]
          assert not feedback["duplicate_batch"]
          assert len(feedback["confirmed_edges"]) == 1

          unsat = json.loads(
              Path("/tmp/configfuzz-feedback-unsat.json").read_text()
          )["plan"]
          sat = json.loads(
              Path("/tmp/configfuzz-feedback-sat.json").read_text()
          )["plan"]
          assert unsat["status"] == "unsat"
          assert sat["status"] == "sat"
          PY
      - name: Runtime inference smoke test
        run: >-
          python -m configfuzz infer
          examples/toy_parallel_size.json
          --samples-output /tmp/configfuzz-runtime-samples.json
          --output /tmp/configfuzz-runtime-spec.json
      - name: Manual constraint corpus check
        run: |
          python scripts/build_lmsv_manual_corpus.py --check
          python -m configfuzz validate-corpus corpus/lmsv/manual_constraints.yaml --output /tmp/configfuzz-corpus-summary.json
